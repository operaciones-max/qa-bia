name: QA BIA Automatico

on:
  schedule:
    # Colombia 06:00 y 10:00 (UTC 11:00 y 15:00) — cada 4h en la maniana
    - cron: '0 11,15 * * *'
    # Colombia 12:00–18:00 (UTC 17:00–23:00) — cada 1h en la tarde
    - cron: '0 17-23 * * *'
    # 18:01–05:59 Colombia: apagado para no gastar tokens
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar entorno
        run: |
          git log -1 --oneline
          rm -f config.py

      - name: Correr QA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: python qa_bia.py

      - name: Guardar estado procesados
        run: |
          git config user.email "qa-bot@bia.app"
          git config user.name "QA Bot"
          git add -f actas_procesadas.json || true
          git add -f visitas_previas.json || true
          git add -f alcances_procesados.json || true
          git add -f groq_cooldown.json || true
          git add -f facturas_extraidas.json || true
          git diff --staged --quiet || git commit -m "Actualizar estado procesados [skip ci]"
          git checkout -- . || true
          git clean -fd || true
          git pull --rebase origin main || true
          git push || true
