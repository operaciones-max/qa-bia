name: QA BIA Automatico

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install groq pdfplumber requests twilio

      - name: Eliminar config viejo
        run: rm -f config.py create_config.py && echo "Commit: $(git log -1 --oneline)"

      - name: Correr QA
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python qa_bia.py

      - name: Guardar estado procesados
        run: |
          git config user.email "qa-bot@bia.app"
          git config user.name "QA Bot"
          git add -f actas_procesadas.json visitas_previas.json alcances_procesados.json || true
          git diff --staged --quiet || git commit -m "Actualizar estado procesados [skip ci]"
          git push || true