name: QA BIA Automatico

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install groq pdfplumber requests twilio

      - name: Eliminar config viejo
        run: rm -f config.py create_config.py

      - name: Correr QA
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python qa_bia.py