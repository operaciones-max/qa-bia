name: Limpiar facturas para reprocesar

on:
  workflow_dispatch:

jobs:
  limpiar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Correr limpieza
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: go run ./backend/cmd/limpiar-facturas

      - name: Commitear caches actualizados
        run: |
          git config user.email "qa-bot@bia.app"
          git config user.name "QA Bot"
          git add -f backend/state/actas_procesadas.json || true
          git add -f backend/state/facturas_extraidas.json || true
          git diff --staged --quiet || git commit -m "Limpiar caches de factura para reprocesar [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || true
